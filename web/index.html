<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var savedPath = params.get('__gh_pages_path');

    if (!savedPath) {
      return;
    }

    var target;

    try {
      target = new URL(savedPath, window.location.origin);
    } catch (_) {
      return;
    }

    // فقط مسیرهای داخلی برنامه مجاز هستند.
    if (
      target.origin !== window.location.origin ||
      !target.pathname.startsWith('/auth/invite') &&
      target.pathname !== '/' &&
      !target.pathname.startsWith('/login')
    ) {
      return;
    }

    window.history.replaceState(
      null,
      '',
      '/trazyar' + target.pathname
        + target.search
        + target.hash
    );
  })();
</script>
