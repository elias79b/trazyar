<!DOCTYPE html>
<html lang="fa">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="سامانه ترازیار">

  <title>ترازیار</title>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var savedPath = params.get('__gh_pages_path');

      if (!savedPath) return;

      var target;

      try {
        target = new URL(savedPath, window.location.origin);
      } catch (_) {
        return;
      }

      if (
        target.origin !== window.location.origin ||
        !(
          target.pathname === '/auth/invite' ||
          target.pathname === '/' ||
          target.pathname === '/login'
        )
      ) {
        return;
      }

      window.history.replaceState(
        null,
        '',
        '/trazyar' + target.pathname +
          target.search +
          target.hash
      );
    })();
  </script>
</head>
